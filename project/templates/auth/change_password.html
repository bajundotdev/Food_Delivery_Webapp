{% extends 'base.html' %}

{% block title %}
    <div class="container mt-2">
        <div class="row d-flex">
            <div class="col">
                <h2>Update User Profile</h2>
            </div>
        </div>
    </div>
{% endblock %}

{% block breadcrumb %}
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="bg-light py-2">
        <div class="container">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{{ url_for('admin.admin_dashboard')}}">Home</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('user.profile') }}">My Profile</a></li>
                <li class="breadcrumb-item active" aria-current="page">Update</li>
            </ol>
        </div>
    </nav>
{% endblock %}

{% block main %}
    <!-- Main content -->
    <main class="container my-4">
        
        <!-- Update Menu Section -->
        <section>
            <div class="row mt-5">
                <div class="col-12">
                    <h4 class="mb-4">Update your profile</h4>
                    <div class="card">
                    <div class="card-body">
                        <form action="{{ url_for('user.save_password') }}" method="post" class="row g-3 mb-4" enctype="multipart/form-data">
                            <div class="col-md-12">
                                <div class="form-floating">
                                <input type="password" class="form-control" id="current_password" name="current_password" placeholder="Current Password" required>
                                <label for="current_password">Current Password</label>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-floating">
                                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Current Password" required>
                                <label for="new_password">New Password</label>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-floating">
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Current Password" required>
                                <label for="confirm_password">Confirm Password</label>
                                </div>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary">Save</button>
                            </div>
                            {{ form.csrf_token }}
                            {{ form.hidden_tag() }}
                        </form>
                    
                    </div>
                    </div>
                </div>
            </div>
        </section>

    </main>
{% endblock %}
