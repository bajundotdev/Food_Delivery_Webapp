{% extends 'base.html' %}

{% block main %}

    <!-- Main container -->
    <main class="container my-4">
        <div class="row">
            <div class="d-flex justify-content-center">
                <div class="col-12 col-sm-12 col-md-10">
                    <h1>Create an account to enjoy exclusive benefits</h1>
                    <!-- Signup Function Modal -->
                    <div class="d-grid gap-3">
                        <!-- Form -->
                        <form action="{{ url_for('auth.register') }}" method="post">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Full Name" required>
                                <label for="fullname">Full Name</label>
                            </div>
                            <div class="row">
                                <div class="col-12 col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="phone_number" name="phone_number" placeholder="Phone number" required>
                                        <label for="phone_number">Phone number</label>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control" id="email" name="email" placeholder="Email Address" required>
                                        <label for="email">Email Address</label>
                                    </div>
                                </div>
                            </div>
                            <hr> 
                            <!--Address-->
                            <div class="row">
                                <div class="col-12 col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="label" name="label" placeholder="Label (e.g. House Number)" required>
                                        <label for="label">Label (e.g. House Number)</label>
                                    </div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="address_line1" name="address_line1" placeholder="Address Line 1" required>
                                        <label for="address_line1">Address Line 1</label>
                                    </div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="address_line2" name="address_line2" placeholder="Address Line 2" required>
                                        <label for="Address Line 2">Address Line 2</label>
                                    </div>
                                </div>
                            </div> 
                            <div class="row">
                                <div class="col-12 col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="city" name="city" placeholder="City" required>
                                        <label for="city">City</label>
                                    </div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="state" name="state" placeholder="State" required>
                                        <label for="state">State</label>
                                    </div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="postal_code" name="postal_code" placeholder="PostalCode" required>
                                        <label for="postal_code">Postal Code</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="country" name="country" placeholder="Country" required>
                                <label for="country">Country</label>
                            </div>
                            <hr> <!--end address-->
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                                <label for="password">Password</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="signupConfirmPassword" name="confirm_password" placeholder="Confirm Password" required>
                                <label for="signupConfirmPassword">Confirm Password</label>
                            </div>
                            <button type="submit" class="btn btn-danger w-100">Sign up</button>
                            {{ form.csrf_token }}
                        </form>
                        
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-dark">Login instead</a>
                        <p>By signing up, you agree to our <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

{% endblock %}
