{% extends 'base.html' %}

{% block title %}
    <div class="container mt-2">
        <div class="row d-flex">
            <div class="col">
                <h2>Add Menu</h2>
            </div>
        </div>
    </div>
{% endblock %}

{% block breadcrumb %}
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="bg-light py-2">
        <div class="container">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{{ url_for('admin.admin_dashboard')}}">Home</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('admin.manage_restaurant') }}">Restaurant</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('admin.manage_product') }}">Menus</a></li>
                <li class="breadcrumb-item active" aria-current="page">Add Menu</li>
            </ol>
        </div>
    </nav>
{% endblock %}

{% block main %}
    <!-- Main content -->
    <main class="container my-4">
        <!-- Collapsible Quick Actions -->
        {% include 'admin/admin_quick_actions.html' %}
        
        <!-- Add Menu Section -->
        <section>
            <div class="row mt-5">
                <div class="col-12">
                    <h4 class="my-4">New Menu Details</h4>
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <form action="{{ url_for('admin.add_product') }}" method="post" class="row g-3 mb-4" enctype="multipart/form-data">
                                {{ form_product.csrf_token}}
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="product_name" name="product_name" placeholder="Menu Name" required>
                                        <label for="product_name">Menu Name</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <select class="form-select" id="category" name="category" required>
                                            <option value="" disabled selected>Select Category</option>
                                            {% for category in categories %}
                                                <option value="{{ category['category_id'] }}">{{ category['category_name'] }}</option>
                                            {% endfor %}
                                        </select>
                                        <label for="category">Category</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="number" step="0.01" class="form-control" id="price" name="price" placeholder="Price" required>
                                        <label for="price">Price</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <select class="form-select" id="is_active" name="is_active" required>
                                            <option value="1" selected>Active</option>
                                            <option value="0">Inactive</option>
                                        </select>
                                        <label for="is_active">Status</label>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="form-floating">
                                        <input type="file" class="form-control" id="food_image_url" name="food_image_url" value="" accept="image/*">
                                        <label for="food_image_url">Menu Image</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <textarea class="form-control" id="description" name="description" placeholder="Description" style="height: 100px"></textarea>
                                        <label for="description">Description</label>
                                    </div>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-success">Save Menu</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>
{% endblock %}
