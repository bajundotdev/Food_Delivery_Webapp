{% extends 'base.html' %}

{% block title %}
    <div class="container mt-2">
        <div class="row d-flex">
            <div class="col">
                <h2>Manage Restaurant</h2>
            </div>
        </div>
    </div>
{% endblock %}

{% block breadcrumb %}
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="bg-light py-2">
        <div class="container">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{{ url_for('admin.admin_dashboard')}}">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Restaurant</li>
            </ol>
        </div>
    </nav>
{% endblock %}

{% block main %}
    <!-- Main content -->
    <main class="container my-4">
        <!-- Collapsible Quick Actions -->
        {% include 'admin/admin_quick_actions.html' %}

        <!-- Restaurant Management Section -->
        <section>
            <div class="row mt-5">
                <div class="col-12">
                    <h4>Update Restaurant Details</h4>
                    <form method="post" class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="restaurant_name" name="restaurant_name" placeholder="Restaurant Name" value="">
                                <label for="restaurant_name">Restaurant Name</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="email" class="form-control" id="restaurant_email" name="restaurant_email" placeholder="Email" value="">
                                <label for="restaurant_email">Email</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="restaurant_phone" name="restaurant_phone" placeholder="Phone" value="">
                                <label for="restaurant_phone">Phone</label>
                            </div>
                        </div>
                        <div class="col-md-6"></div>
                            <div class="form-floating">
                                <input type="text" class="form-control" id="restaurant_address" name="restaurant_address" placeholder="Address" value="">
                                <label for="restaurant_address">Address</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-floating">
                                <textarea class="form-control" id="restaurant_description" name="restaurant_description" placeholder="Description" style="height: 100px"></textarea>
                                <label for="restaurant_description">Description</label>
                            </div>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary">Update Details</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
{% endblock %}
