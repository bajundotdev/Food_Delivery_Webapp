{% extends 'base.html' %}

{% block alerts %}
    {% for message in session['_flashes'] %}
        {% if message[0] == 'error' %}
            <div class="alert alert-danger d-flex align-items-center alert-dismissible fade show" role="alert">
                <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Danger:"><use xlink:href="#exclamation-triangle-fill"/></svg>
                <div>
                    {{ message[1] }}
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}
    {% endfor %}
    {{ session }}
{% endblock %}

{% block main %}
    <!-- Main container -->
    <main class="container my-4">
        <h1>Login or sign up to continue</h1>
        <form method="post">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="username" name="username" placeholder="Email Address" required>
                <label for="Email">Email Address</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <label for="Password">Password</label>
            </div>
            <button type="submit" class="btn btn-danger w-100">Login</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('auth.register') }}" class="btn btn-outline-dark w-100">Sign up</a>
        </div>
    </main>

{% endblock %}
