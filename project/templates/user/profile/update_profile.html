{% extends 'base.html' %}

{% block title %}
    <div class="container mt-2">
        <div class="row d-flex">
            <div class="col">
                <h2>Update User Profile</h2>
            </div>
        </div>
    </div>
{% endblock %}

{% block breadcrumb %}
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="bg-light py-2">
        <div class="container">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{{ url_for('admin.admin_dashboard')}}">Home</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('user.profile') }}">My Profile</a></li>
                <li class="breadcrumb-item active" aria-current="page">Update</li>
            </ol>
        </div>
    </nav>
{% endblock %}

{% block main %}
    <!-- Main content -->
    <main class="container my-4">
        
        <!-- Update Menu Section -->
        <section>
            <div class="row mt-5">
                <div class="col-12">
                    <h4 class="mb-4">Update your profile</h4>
                    <div class="card">
                    <div class="card-body">
                        <form action="{{ url_for('user.save_profile') }}" method="post" class="row g-3 mb-4" enctype="multipart/form-data">
                            <div class="col-md-12">
                                <div class="form-floating">
                                <input readonly type="email" class="form-control" id="email" name="email" placeholder="{{ user_details[0].email }}" value="{{ user_details[0].email }}" required>
                                <label for="email">Email</label>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-floating">
                                <input type="text" class="form-control" id="fullname" name="fullname" placeholder="{{ user_details[0].name }}" value="{{ user_details[0].name }}" required>
                                <label for="first_name">Full Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="{{ user_details[0].phone }}" value="{{ user_details[0].phone }}" required>
                                <label for="phone">Phone</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                <input type="file" class="form-control" id="profile_image" name="profile_image" accept="image/*" required>
                                <label for="profile_image">Profile Image</label>
                                </div>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        
                        </form>
                        {% if name and photo %}
                            <h3>{{ name }}'s Profile Photo:</h3>
                            <img src="{{ url_for('static', filename='img/profile_photos' + photo) }}" width="200">
                        {% endif %}
                    </div>
                    </div>
                </div>
            </div>
        </section>

    </main>
{% endblock %}
