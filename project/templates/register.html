{% extends 'base.html' %}

{% block main %}

    <!-- Main container -->
    <main class="container my-4">
        <!-- Signup Function Modal -->
        <h1>Create an account to enjoy exclusive benefits</h1>
        <div class="d-grid gap-3">
            <!-- Form -->
            <form>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="signupName" placeholder="Full Name" required>
                    <label for="signupName">Full Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="signupEmail" placeholder="Email Address" required>
                    <label for="signupEmail">Email Address</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="signupPassword" placeholder="Password" required>
                    <label for="signupPassword">Password</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="signupConfirmPassword" placeholder="Confirm Password" required>
                    <label for="signupConfirmPassword">Confirm Password</label>
                </div>
                <button type="submit" class="btn btn-danger w-100">Sign up</button>
            </form>
            
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-dark">Login instead</a>
            <p>By signing up, you agree to our <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.</p>
        </div>
    </main>

{% endblock %}
