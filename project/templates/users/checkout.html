    <!-- Main content: Checkout form + Order summary -->
    <main class="container my-4">
        <h1 class="mb-4">Checkout</h1>
        <div class="row">
        <!-- Checkout Form (Delivery details + Payment) -->
        <div class="col-lg-8 mb-4">
            <form action="tracking.html">
            <h2 class="h5 mb-3">Delivery Details</h2>
            <div class="mb-3">
                <label for="fullname" class="form-label">Full Name</label>
                <input type="text" id="fullname" class="form-control" placeholder="Enter your name" />
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number" />
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" />
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Delivery Address</label>
                <input type="text" id="address" class="form-control" placeholder="Enter delivery address" />
            </div>
            <div class="mb-3">
                <label for="delivery-time" class="form-label">Preferred Delivery Time</label>
                <input type="datetime-local" id="delivery-time" class="form-control" />
            </div>
            <div class="mb-3">
                <label for="instructions" class="form-label">Delivery Instructions</label>
                <textarea id="instructions" class="form-control" rows="3" placeholder="Additional instructions (optional)"></textarea>
            </div>
            <h2 class="h5 mb-3">Payment</h2>
            <div class="mb-3">
                <!-- Payment method radio options -->
                <div class="form-check">
                <input class="form-check-input" type="radio" name="paymentMethod" id="payCard" checked />
                <label class="form-check-label" for="payCard">Credit Card</label>
                </div>
                <div class="form-check">
                <input class="form-check-input" type="radio" name="paymentMethod" id="payPaypal" />
                <label class="form-check-label" for="payPaypal">PayPal</label>
                </div>
                <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="paymentMethod" id="payCOD" />
                <label class="form-check-label" for="payCOD">Cash on Delivery</label>
                </div>
            </div>
            <button type="submit" class="btn btn-danger">Place Order</button>
            </form>
        </div>
        <!-- Order Summary (right column) -->
        <div class="col-lg-4">
            <div class="card mb-4">
            <div class="card-header">Order Summary</div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between">
                <span>Margherita Pizza x 2</span>
                <span>$16.00</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                <span>Butter Chicken Curry x 1</span>
                <span>$15.99</span>
                </li>
                <li class="list-group-item d-flex justify-content-between fw-bold">
                <span>Total</span>
                <span>$31.99</span>
                </li>
            </ul>
            </div>
        </div>
        </div>
    </main>
